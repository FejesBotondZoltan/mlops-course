# Week 10 Lab — KServe Rollout (starter)
#
#   postgres           relational store — MLflow metadata and Prefect state
#   s3                 Silo object store — model files and DVC data
#   s3-create-bucket   one-shot job that creates both buckets
#   mlflow             tracking server and model registry
#   prefect            orchestration server and UI
#
# Tutorial: https://mlflow.org/docs/latest/ml/tracking/tutorials/remote-server/
# Deviation: the tracking server is containerized rather than run on the host,
# so the whole stack starts with one command.
#
#   cp .env.example .env
#   docker compose up -d --wait    # start, and wait for healthchecks
#   docker compose down            # stop; data persists in the named volumes
#   docker compose down -v         # stop and wipe the volumes
#
# Every lab uses the same 55xx host ports, so stop the Week 9 stack first:
#   cd ../../week-09-serving/starter && make down

# A per-lab project name. Without it, Compose uses the directory name, which
# every lab shares, so the labs would share containers and volumes.
name: week10-kserve-rollout-starter

services:

  # ── Postgres: relational backend store ─────────────────────────────────────
  # Stores experiment names, run IDs, parameters, metrics, and tags.
  # Image pinned to 16.3 for reproducibility.
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # NEW in Week 8. Prefect keeps its own state -- flow runs, task runs,
      # deployments, schedules -- and it does NOT share MLflow's schema.
      PREFECT_DB: ${PREFECT_DB:-prefectdb}
    ports:
      - "${POSTGRES_HOST_PORT:-5532}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the SECOND database on first initialisation of the volume.
      #
      # THE TRAP, and it is worth knowing before it costs you an hour: scripts
      # in docker-entrypoint-initdb.d run ONLY when the data directory is
      # empty. Re-use a volume from an earlier week and this never executes, so
      # the Prefect server starts, fails to find its database, and says nothing
      # about volumes. `make down-v` (or the per-week project name, which gives
      # this week its own volume) is what actually fixes it.
      - ./init-prefect-db.sh:/docker-entrypoint-initdb.d/10-prefect-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Silo: S3-compatible object store ───────────────────────────────────────
  # Silo is a community fork of MinIO (MinIO's own images left Docker Hub in
  # September 2026). It keeps MinIO's MINIO_* variables, `mc` client and console.
  # Stores model artifacts (serialized pipelines, plots, etc.).
  # Uses a TCP healthcheck (from the official MLflow tutorial) rather than
  # the HTTP endpoint, for maximum compatibility.
  s3:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "${S3_API_PORT:-5510}:9000"
      - "${S3_CONSOLE_PORT:-5511}:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── s3-create-bucket: one-shot bucket initialisation ───────────────────────
  # Runs once after Silo is healthy. Creates the artifacts bucket if it does
  # not already exist (idempotent via --ignore-existing).
  s3-create-bucket:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      bash -c "
        mc alias set s3 http://s3:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
        mc mb --ignore-existing s3/${MLFLOW_BUCKET} &&
        mc mb --ignore-existing s3/${DVC_BUCKET}
      "

  # ── MLflow tracking server ──────────────────────────────────────────────────
  # Built from our pinned mlflow.Dockerfile.
  # --backend-store-uri: Postgres connection using the compose DNS name "postgres"
  # --artifacts-destination: Silo bucket via S3 protocol
  # --allowed-hosts: required by MLflow 3.5.0+ security middleware (--host 0.0.0.0)
  # The client only needs MLFLOW_TRACKING_URI; Silo credentials stay server-side.
  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    environment:
      # Silo S3 credentials — server-side only, not exposed to the client
      MLFLOW_S3_ENDPOINT_URL: http://s3:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    command:
      - --backend-store-uri
      - postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - --artifacts-destination
      - s3://${MLFLOW_BUCKET}
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --allowed-hosts
      # MLflow's host check is an exact/fnmatch match that does NOT strip the port,
      # so bare "localhost" will not match the browser's "Host: localhost:5500".
      # The "host:*" wildcards accept any port (host 5500, internal 5000, or a
      # student-overridden MLFLOW_PORT) while still restricting to localhost/127.0.0.1.
      - "localhost,127.0.0.1,mlflow,localhost:*,127.0.0.1:*,mlflow:*"
    ports:
      - "${MLFLOW_PORT:-5500}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      s3-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ── Prefect server ────────────────────────────────────────────────────────
  #
  # PINNED to the same version as the client in pyproject.toml, for the same
  # reason `mlflow==3.13.0` is pinned: a client and a server that drift are a
  # class of bug you end up debugging through a REST API. Note this is a real
  # tag -- `3.8.2-python3.12` -- not `3-latest`.
  prefect:
    image: prefecthq/prefect:3.8.2-python3.12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # `PREFECT_SERVER_DATABASE_CONNECTION_URL`, NOT `PREFECT_API_...`.
      # The setting was renamed; every older blog post uses the old name and
      # the failure mode is a server that starts and then cannot find its
      # database.
      PREFECT_SERVER_DATABASE_CONNECTION_URL: >-
        postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${PREFECT_DB:-prefectdb}
      PREFECT_SERVER_API_HOST: 0.0.0.0
    command: prefect server start --host 0.0.0.0 --port 4200
    ports:
      - "${PREFECT_PORT:-5520}:4200"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  s3-data:
